name: 译文或图形改进
description: 带来源与消费者的修改建议
title: "[汉化] "
body:
  - type: input
    id: source_id
    attributes:
      label: 记录ID／资源ID／场景
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: 原译、建议与理由（只贴必要短原文）
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 资料出处、是否官方定名、验证范围
